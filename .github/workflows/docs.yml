name: Documentation Build & Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 09:00 UTC to catch external link rot
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Docs build & link validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check if docs or code were modified on pull requests; always reports green if unrelated
      - name: Check touched paths on pull requests
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          # Compare PR HEAD against merge base
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED" > .changed_files.txt
          if grep -qE '(^docs/|^frontend/|^contracts/|^scripts/build-docs\.sh|\.md$|lychee|\.github/workflows/docs\.yml)' .changed_files.txt; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "Documentation-related files modified; proceeding with build and link check."
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "No documentation-related paths touched; skipping check to satisfy required status checks."
            echo "### Documentation Check Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No documentation or markdown files were modified in this pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Rust toolchain
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none

      - name: Setup Node.js toolchain
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        run: npm --prefix frontend ci

      - name: Build documentation references (Rustdoc & TypeDoc)
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        run: bash scripts/build-docs.sh docs-site

      - name: Restore lychee cache
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-cache-${{ runner.os }}-

      # Check internal links, relative paths, and anchors strictly; external links warn on PRs
      - name: Run lychee link checker
        if: github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --ignore-path .lycheeignore
            --cache
            --max-cache-age 1d
            --output lychee-report.md
            "**/*.md" "docs-site/**/*.html"
          fail: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append link check results to job summary
        if: (always()) && (github.event_name != 'pull_request' || steps.filter.outputs.run_checks == 'true')
        run: |
          if [ -f lychee-report.md ]; then
            echo "## Documentation Link Check Results" >> "$GITHUB_STEP_SUMMARY"
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
