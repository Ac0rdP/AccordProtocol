name: Supply-chain policy

# Enforces docs/SUPPLY_CHAIN_POLICY.md. pull_request_review re-runs only the
# exception-review gate when a review lands.
on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Pinning policy
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check lockfiles, sources, action pins and exceptions
        run: node scripts/check-supply-chain.mjs

  npm-provenance:
    name: npm provenance (${{ matrix.dir }})
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend, indexer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install from the lockfile without running install scripts
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts
      - name: Verify registry signatures and provenance attestations
        working-directory: ${{ matrix.dir }}
        run: npm audit signatures

  cargo-sources:
    name: Cargo sources and lockfile
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Lockfile is complete and up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Only crates.io is an allowed source
        run: cargo deny check sources

  exception-review:
    name: Exception changes need an approving review
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const watched = ['supply-chain/exceptions.json', 'scripts/check-supply-chain.mjs'];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const touched = files.map((f) => f.filename).filter((f) => watched.includes(f));
            if (touched.length === 0) {
              core.info('No supply-chain exception or policy changes.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            // Latest decisive review per reviewer wins; the author cannot approve their own change.
            const latest = new Map();
            for (const r of reviews) {
              if (r.user.login !== pr.user.login && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                latest.set(r.user.login, r.state);
              }
            }
            const approved = [...latest.values()].includes('APPROVED');
            const blocked = [...latest.values()].includes('CHANGES_REQUESTED');
            if (!approved || blocked) {
              core.setFailed(`${touched.join(', ')} changed: needs an approving review from someone other than the author.`);
            }
