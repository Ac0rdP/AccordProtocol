name: Smart Contract - Build & CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel superseded pull-request runs on the same branch; never cancel a push to
# main or a tag run (those feed releases and the testnet gates below).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Contract CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Soroban builds require wasm32v1-none (setup-rust-toolchain uses singular `target`).
          target: wasm32v1-none
          # Cache the cargo registry/git and target dir between runs.
          cache: true

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit
        run: |
          cargo audit

      - name: Run cargo deny
        run: |
          cargo deny check

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v25.0.0

      - name: Build smart contracts
        run: |
          # stellar-cli v25+ has no --release flag; release profile is the default.
          stellar contract build

      - name: Run contract test suite (flat weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=flat cargo test -- --nocapture

      - name: Run contract test suite (skewed weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=skewed cargo test -- --nocapture

      - name: Run RBAC tests
        run: cargo test -- rbac -- --nocapture

      - name: Generate wasm-manifest.json
        run: |
          python3 <<'PY'
          import glob
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone

          wasm_files = sorted(glob.glob("target/wasm32*/release/*.wasm"))
          if not wasm_files:
              raise SystemExit("No WASM files found after contract build")

          # Prefer the Accord contract artifact when multiple WASMs exist.
          wasm_path = next(
              (p for p in wasm_files if os.path.basename(p) == "accord.wasm"),
              wasm_files[0],
          )

          with open(wasm_path, "rb") as f:
              wasm_hash = hashlib.sha256(f.read()).hexdigest()

          cargo_toml = open("Cargo.toml", encoding="utf-8").read()
          match = re.search(
              r'^soroban-sdk\s*=\s*"=?([^"\n]+)"',
              cargo_toml,
              flags=re.MULTILINE,
          )
          if not match:
              raise SystemExit("Could not read soroban-sdk version from Cargo.toml")
          soroban_sdk_version = match.group(1)

          # Probed: True if contract source includes feature capability flags
          try:
              lib_rs = open("contracts/accord/src/lib.rs", encoding="utf-8").read()
              supports_recurring_payments = "RecurringPayment" in lib_rs and "disburse_recurring" in lib_rs
              supports_rbac = ("GrantRole" in lib_rs and "RevokeRole" in lib_rs) or ("get_roles" in lib_rs and "get_role_version" in lib_rs)
          except FileNotFoundError:
              supports_recurring_payments = False
              supports_rbac = False

          manifest = {
              "wasm_file": os.path.basename(wasm_path),
              "wasm_hash": wasm_hash,
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "build_timestamp": datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "soroban_sdk_version": soroban_sdk_version,
              "supports_recurring_payments": supports_recurring_payments,
              "supports_rbac": supports_rbac,
          }

          with open("wasm-manifest.json", "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2)
              out.write("\n")

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload compiled WASM artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: accord-contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32*/release/*.wasm
            wasm-manifest.json
          retention-days: 90

      - name: Report WASM file sizes
        run: |
          python3 -c '
          import os, glob
          files = glob.glob("target/wasm32*/release/*.wasm")
          if not files:
              print("No WASM files found in release target directories.")
          for f in files:
              if os.path.isfile(f):
                  size_bytes = os.path.getsize(f)
                  size_kb = size_bytes / 1024.0
                  print(f"Contract: {os.path.basename(f)} | Size: {size_kb:.2f} KB ({size_bytes} bytes)")
          '

  # Snapshot verification (#815). Runs the deterministic contract tests and
  # reports when the working tree's snapshots differ from the committed ones.
  # The report is advisory so an existing stale baseline cannot block every
  # pull request; the full patch is uploaded as an artifact. Property tests opt
  # out of snapshot capture because their random inputs would churn the
  # directory on every run.
  snapshots:
    name: Contract Snapshot Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests and report snapshot drift
        env:
          SNAPSHOT_VERIFY_WARN_ONLY: '1'
        run: bash scripts/verify-snapshots.sh

      - name: Upload snapshot verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-snapshot-verification
          path: target/snapshot-verification
          retention-days: 30
          if-no-files-found: ignore

  # Coverage gate (#813). Separate from `ci` so a failing test there is reported
  # once, there; --ignore-run-fail lets this job still measure coverage and
  # enforce the threshold. The threshold lives in contracts/accord/Cargo.toml.
  coverage:
    name: Contract Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Read coverage threshold
        id: threshold
        run: |
          threshold=$(sed -n 's/^min-line-coverage *= *\([0-9][0-9.]*\).*/\1/p' contracts/accord/Cargo.toml)
          if [ -z "$threshold" ]; then
            echo "min-line-coverage is missing from contracts/accord/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$threshold" >> "$GITHUB_OUTPUT"

      - name: Measure contract coverage
        run: |
          cargo llvm-cov -p accord --lib --no-report --ignore-run-fail \
            --ignore-filename-regex '(test|bench)\.rs$'

      - name: Write coverage reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --ignore-filename-regex '(test|bench)\.rs$' --html --output-dir target/coverage
          cargo llvm-cov report --ignore-filename-regex '(test|bench)\.rs$' --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex '(test|bench)\.rs$' --summary-only | tee target/coverage/summary.txt
          {
            echo "### Contract coverage"
            echo
            echo "Minimum line coverage: ${{ steps.threshold.outputs.value }}%"
            echo
            echo '```'
            cat target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: target/coverage
          retention-days: 30

      - name: Enforce coverage threshold
        run: |
          cargo llvm-cov report --ignore-filename-regex '(test|bench)\.rs$' \
            --fail-under-lines "${{ steps.threshold.outputs.value }}"

  # Resource/CPU regression gate (#814). Compares the metered cost of the hot
  # entrypoints with contracts/accord/bench-baseline.txt and fails when any
  # figure grows past the threshold (default 5%). See CONTRIBUTING.md.
  benchmarks:
    name: Contract Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Run resource benchmarks
        run: cargo test -p accord --lib bench_hot_entrypoints -- --nocapture

      - name: Report benchmark deltas
        if: always()
        run: |
          if [ -f target/bench/report.md ]; then
            cat target/bench/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-benchmarks
          path: target/bench
          retention-days: 30
          if-no-files-found: ignore

      # Fork pull requests get a read-only token, so commenting is best effort;
      # the deltas are always in the job summary and the artifact above.
      - name: Comment deltas on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('target/bench/report.md')) return;
            const marker = '<!-- accord-contract-benchmarks -->';
            const body = `${marker}\n${fs.readFileSync('target/bench/report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Runs only on push to main — never on pull requests.
  # Requires TESTNET_CONTRACT_ID to be set as a repository variable under
  # Settings → Secrets and variables → Actions → Variables.
  # When the variable is absent the job logs a message and exits cleanly so
  # forks and contributor PRs are unaffected.
  testnet-smoke-test:
    name: Testnet Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check TESTNET_CONTRACT_ID is configured
        id: guard
        run: |
          if [ -z "${{ vars.TESTNET_CONTRACT_ID }}" ]; then
            echo "TESTNET_CONTRACT_ID repository variable is not set — skipping smoke test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Stellar CLI
        if: steps.guard.outputs.skip != 'true'
        uses: stellar/stellar-cli@v25.0.0

      - name: Simulate get_total_proposals on deployed testnet contract
        if: steps.guard.outputs.skip != 'true'
        id: invoke
        run: |
          result=$(stellar contract invoke \
            --network testnet \
            --id "${{ vars.TESTNET_CONTRACT_ID }}" \
            -- get_total_proposals)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Report live proposal count
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "Deployed contract get_total_proposals returned: ${{ steps.invoke.outputs.result }}"

  # Pre-mainnet deployment gate (issue #420).
  # Runs on version tags (v*) that gate mainnet deployment. Queries the live
  # testnet contract and fails if sum(owner weights) != get_total_weight.
  # Skips cleanly when TESTNET_CONTRACT_ID is unset (same pattern as smoke test).
  weight-invariant-gate:
    name: Weight Invariant Gate
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check TESTNET_CONTRACT_ID is configured
        id: guard
        run: |
          if [ -z "${{ vars.TESTNET_CONTRACT_ID }}" ]; then
            echo "TESTNET_CONTRACT_ID repository variable is not set — skipping weight invariant gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Stellar CLI
        if: steps.guard.outputs.skip != 'true'
        uses: stellar/stellar-cli@v25.0.0

      - name: Verify total-weight invariant on testnet
        if: steps.guard.outputs.skip != 'true'
        env:
          CONTRACT_ID: ${{ vars.TESTNET_CONTRACT_ID }}
        run: |
          set -euo pipefail
          weights_raw=$(stellar contract invoke \
            --network testnet \
            --id "$CONTRACT_ID" \
            -- get_owner_weights)
          total_raw=$(stellar contract invoke \
            --network testnet \
            --id "$CONTRACT_ID" \
            -- get_total_weight)

          export WEIGHTS_RAW="$weights_raw"
          export TOTAL_RAW="$total_raw"

          python3 <<'PY'
          import json, os, re, sys

          def parse_u32(value):
              if isinstance(value, bool):
                  raise TypeError(value)
              if isinstance(value, int):
                  return value
              if isinstance(value, str):
                  return int(value, 10)
              raise TypeError(type(value))

          def extract_weight(entry):
              if isinstance(entry, dict):
                  for key, val in entry.items():
                      if str(key).lower() == "weight":
                          return parse_u32(val)
              raise ValueError(f"Cannot read weight from entry: {entry!r}")

          weights_raw = os.environ["WEIGHTS_RAW"].strip()
          total_raw = os.environ["TOTAL_RAW"].strip()

          try:
              weights = json.loads(weights_raw)
          except json.JSONDecodeError:
              found = re.findall(r'"?weight"?\s*[:=]\s*"?(\d+)"?', weights_raw, flags=re.I)
              if not found:
                  print("Failed to parse get_owner_weights output:", weights_raw, file=sys.stderr)
                  sys.exit(1)
              summed = sum(int(w) for w in found)
          else:
              if not isinstance(weights, list):
                  print("Expected a list from get_owner_weights, got:", type(weights), file=sys.stderr)
                  sys.exit(1)
              summed = sum(extract_weight(entry) for entry in weights)

          try:
              reported = parse_u32(json.loads(total_raw))
          except Exception:
              m = re.search(r"\d+", total_raw)
              if not m:
                  print("Failed to parse get_total_weight output:", total_raw, file=sys.stderr)
                  sys.exit(1)
              reported = int(m.group(0))

          print(f"sum(owner weights) = {summed}")
          print(f"get_total_weight   = {reported}")

          if summed != reported:
              print(
                  "Weight invariant failed: sum of owner weights does not equal reported total weight.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Weight invariant OK.")
          PY
