name: Nightly Full Suite

# Runs the complete test surface — including the slower integration and E2E
# suites that a fast pull-request pipeline skips — once a night. Failures are
# attributed to the component that owns them and surfaced as a single, tracked
# issue so nothing slips through.
#
# See docs/CI.md for the workflow map and CONTRIBUTING.md for how to run any of
# these suites locally.

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it does not collide with other cron jobs
    # that tend to pile up on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Serialize nightly runs; never cancel one that is already in flight.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: "Contract: full test suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none

      - name: Run contract test suite (flat weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=flat cargo test -p accord -- --nocapture

      - name: Run contract test suite (skewed weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=skewed cargo test -p accord -- --nocapture

      - name: Run RBAC tests
        run: cargo test -p accord -- rbac -- --nocapture

  frontend:
    name: "Frontend: unit tests & coverage"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-frontend-coverage
          path: frontend/coverage
          retention-days: 14

  indexer:
    name: "Indexer: tests (SQLite + Postgres)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accord_indexer_test
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accord -d accord_indexer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: indexer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run indexer tests against both storage backends
        env:
          TEST_POSTGRES_URL: postgres://accord:accord@localhost:5432/accord_indexer_test
        run: npm test

  analytics_api:
    name: "Analytics API: Rust checks & tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accord_analytics_test
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accord -d accord_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p accord-analytics-api -- --check

      - name: Run Clippy
        run: cargo clippy -p accord-analytics-api --all-targets -- -D warnings

      - name: Run API tests
        env:
          TEST_DATABASE_URL: postgres://accord:accord@localhost:5432/accord_analytics_test
        run: cargo test -p accord-analytics-api

  e2e:
    name: "Frontend: E2E (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Failures are attributed to a component and reported on a single tracked
  # issue so the maintainer is notified without an issue being filed every night.
  # ---------------------------------------------------------------------------
  report-failure:
    name: Report nightly failures
    needs: [contract, frontend, indexer, analytics_api, e2e]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@v7
        env:
          CONTRACT: ${{ needs.contract.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INDEXER: ${{ needs.indexer.result }}
          ANALYTICS_API: ${{ needs.analytics_api.result }}
          E2E: ${{ needs.e2e.result }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const marker = '<!-- accord-nightly-failure -->';
            const components = {
              contract: process.env.CONTRACT,
              frontend: process.env.FRONTEND,
              indexer: process.env.INDEXER,
              'analytics-api': process.env.ANALYTICS_API,
              e2e: process.env.E2E,
            };
            const failed = Object.entries(components)
              .filter(([, result]) => result === 'failure')
              .map(([name]) => name);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Nightly CI failure: ${failed.join(', ') || 'unknown'}`;
            const body = [
              marker,
              `The nightly full-suite run failed for: **${failed.join(', ') || 'unknown'}**.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Per-component results:',
              '',
              ...Object.entries(components).map(([name, result]) => `- \`${name}\`: ${result}`),
              '',
              `cc @${process.env.OWNER}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.body && issue.body.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated nightly failure issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created nightly failure issue #${created.data.number}`);
            }
