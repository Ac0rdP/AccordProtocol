name: Nightly Full Suite

# Runs the complete test surface — including the slower integration and E2E
# suites that a fast pull-request pipeline skips — once a night. Failures are
# attributed to the component that owns them and surfaced as a single, tracked
# issue so nothing slips through.
#
# See docs/CI.md for the workflow map and CONTRIBUTING.md for how to run any of
# these suites locally.

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it does not collide with other cron jobs
    # that tend to pile up on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Serialize nightly runs; never cancel one that is already in flight.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: "Contract: full test suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32v1-none

      - name: Run contract test suite (flat weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=flat cargo test --locked -p accord -- --nocapture

      - name: Run contract test suite (skewed weight fixture)
        run: ACCORD_WEIGHT_FIXTURE=skewed cargo test --locked -p accord -- --nocapture

      - name: Run RBAC tests
        run: cargo test --locked -p accord -- rbac -- --nocapture

  contract_fuzz:
    name: "Contract: nightly fuzzing & corpus minimization"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore cached fuzz corpus
        uses: actions/cache@v6
        with:
          path: contracts/fuzz/corpus
          key: contract-fuzz-corpus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            contract-fuzz-corpus-${{ runner.os }}-

      - name: Run fuzz corpus management test suite and preflight check
        run: |
          node --test scripts/fuzz-corpus.test.mjs
          node scripts/fuzz-corpus.mjs validate --report-dir target/fuzz-nightly

      - name: Install nightly Rust toolchain for cargo-fuzz
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          cache: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run extended nightly fuzzing and minimize corpus
        run: |
          set -euo pipefail
          mkdir -p target/fuzz-nightly
          for target in weight_arithmetic proposal_bookkeeping proposal_input_validation; do
            echo "=== Fuzzing $target ==="
            log_file="target/fuzz-nightly/${target}.log"
            if ! cargo fuzz run --fuzz-dir contracts/fuzz "$target" "contracts/fuzz/corpus/${target}" -- -max_total_time=60 -max_len=4096 2>&1 | tee "$log_file"; then
              artifact=$(ls -1t "contracts/fuzz/artifacts/${target}/"* 2>/dev/null | head -n 1 || true)
              if [ -n "$artifact" ]; then
                node scripts/fuzz-corpus.mjs record-crash --target "$target" --input "$artifact" --log-file "$log_file" --report-dir target/fuzz-nightly
              else
                node scripts/fuzz-corpus.mjs record-crash --target "$target" --log-file "$log_file" --report-dir target/fuzz-nightly
              fi
              exit 1
            fi
            cargo fuzz cmin --fuzz-dir contracts/fuzz "$target" "contracts/fuzz/corpus/${target}"
          done
          node scripts/fuzz-corpus.mjs minimize --report-dir target/fuzz-nightly

      - name: Append fuzzing summary to job summary
        if: always()
        run: |
          if [ -f target/fuzz-nightly/crash-report.md ]; then
            cat target/fuzz-nightly/crash-report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f target/fuzz-nightly/report.md ]; then
            cat target/fuzz-nightly/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload nightly fuzzing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-contract-fuzz-report
          path: target/fuzz-nightly
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload minimized fuzz corpus artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-contract-fuzz-corpus
          path: contracts/fuzz/corpus
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    name: "Frontend: unit tests & coverage"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-frontend-coverage
          path: frontend/coverage
          retention-days: 14

  indexer:
    name: "Indexer: tests (SQLite + Postgres)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accord_indexer_test
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accord -d accord_indexer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: indexer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run indexer tests against both storage backends
        env:
          TEST_POSTGRES_URL: postgres://accord:accord@localhost:5432/accord_indexer_test
        run: npm test

  analytics_api:
    name: "Analytics API: Rust checks & tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accord_analytics_test
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accord -d accord_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p accord-analytics-api -- --check

      - name: Run Clippy
        run: cargo clippy --locked -p accord-analytics-api --all-targets -- -D warnings

      - name: Run API tests
        env:
          TEST_DATABASE_URL: postgres://accord:accord@localhost:5432/accord_analytics_test
        run: cargo test --locked -p accord-analytics-api

      - name: Setup Node.js for analytics API 10k RPS load budget gate
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run analytics API 10k RPS load test & budget gate
        run: |
          node --test scripts/analytics-load-test.test.mjs
          node scripts/analytics-load-test.mjs --ci-gate --report-dir target/analytics-load-test

      - name: Append analytics API load report to job summary
        if: always()
        run: |
          if [ -f target/analytics-load-test/report.md ]; then
            cat target/analytics-load-test/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analytics API nightly load report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-analytics-api-load-report
          path: target/analytics-load-test
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: "Frontend: E2E (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: npx playwright test --project=chromium --project=e2e --project=responsive-375 --project=responsive-768 --project=responsive-1440

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Failures are attributed to a component and reported on a single tracked
  # issue so the maintainer is notified without an issue being filed every night.
  # ---------------------------------------------------------------------------
  report-failure:
    name: Report nightly failures
    needs: [contract, contract_fuzz, frontend, indexer, analytics_api, e2e]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@v9
        env:
          CONTRACT: ${{ needs.contract.result }}
          CONTRACT_FUZZ: ${{ needs.contract_fuzz.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INDEXER: ${{ needs.indexer.result }}
          ANALYTICS_API: ${{ needs.analytics_api.result }}
          E2E: ${{ needs.e2e.result }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const marker = '<!-- accord-nightly-failure -->';
            const components = {
              contract: process.env.CONTRACT,
              'contract-fuzz': process.env.CONTRACT_FUZZ,
              frontend: process.env.FRONTEND,
              indexer: process.env.INDEXER,
              'analytics-api': process.env.ANALYTICS_API,
              e2e: process.env.E2E,
            };
            const failed = Object.entries(components)
              .filter(([, result]) => result === 'failure')
              .map(([name]) => name);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Nightly CI failure: ${failed.join(', ') || 'unknown'}`;
            const body = [
              marker,
              `The nightly full-suite run failed for: **${failed.join(', ') || 'unknown'}**.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Per-component results:',
              '',
              ...Object.entries(components).map(([name, result]) => `- \`${name}\`: ${result}`),
              '',
              `cc @${process.env.OWNER}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.body && issue.body.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated nightly failure issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created nightly failure issue #${created.data.number}`);
            }
