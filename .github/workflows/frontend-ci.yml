name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'packages/sdk/**'
      - 'examples/**'
      - 'contracts/accord/src/lib.rs'
      - 'scripts/generate-contract-types.py'
      - 'docs/CONTRACT_TYPES.md'
      - '.github/workflows/frontend-ci.yml'


permissions:
  contents: read
  pull-requests: write

# Cancel superseded pull-request runs on the same branch; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Lint (advisory)
        # The repository has a pre-existing lint backlog (unused imports and
        # `any` usages across the tree). Lint reports here but does not block
        # until that backlog is cleared; type-check and tests are authoritative.
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  contract-types:
    name: Generated contract types are current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Regenerate contract types from the contract interface
        run: python3 scripts/generate-contract-types.py

      - name: Fail if checked-in types are stale
        run: git diff --exit-code -- frontend/src/types/contract.generated.ts

  bundle-budget:
    name: Bundle & load-performance budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Check bundle-size budget
        working-directory: frontend
        run: npm run check:bundle

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Check load-performance budget
        working-directory: frontend
        run: |
          npm run preview -- --port 4173 --strictPort &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null; then break; fi
            sleep 1
          done
          node scripts/check-performance-budget.mjs
          kill "$SERVER_PID"

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report
          path: frontend/bundle-report.json
          if-no-files-found: ignore

      - name: Report bundle size on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'frontend/bundle-report.json';
            if (!fs.existsSync(reportPath)) return;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const fmt = (b) =>
              b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} kB` : `${(b / 1048576).toFixed(2)} MB`;
            const rows = report.checks
              .map((check) => {
                const value = check.raw ? check.actual : fmt(check.actual);
                const limit = check.raw ? check.budget : fmt(check.budget);
                const status = check.actual > check.budget ? '❌ over' : '✅ within';
                return `| ${check.label} | ${value} | ${limit} | ${status} |`;
              })
              .join('\n');
            const body = [
              '## Frontend bundle budget',
              '',
              '| Metric | Current | Budget | Status |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              '### Size change vs baseline',
              `- JavaScript: ${report.deltas.totalJsGzipBytes}`,
              `- CSS: ${report.deltas.totalCssGzipBytes}`,
              `- Largest chunk: ${report.deltas.largestChunkGzipBytes}`,
              '',
              'See `frontend/docs/performance-budgets.md` for how to raise a budget deliberately.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright cross-browser end-to-end tests
        # Advisory while the pre-existing suite is reconciled with the current
        # UI: several specs on `main` still assert screens that were replaced
        # (weighted-governance / owners-weight-distribution). The report is
        # uploaded below so regressions stay visible without blocking merges.
        continue-on-error: true
        working-directory: frontend
        run: npm run e2e:matrix

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  sdk-and-example-build:
    name: SDK & example dApp build & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install SDK dependencies & build
        working-directory: packages/sdk
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Install Example dApp dependencies & build
        working-directory: examples/multisig-dapp
        run: |
          npm install
          npm run build

      - name: Run Example dApp smoke test
        working-directory: examples/multisig-dapp
        run: npm run test:smoke
