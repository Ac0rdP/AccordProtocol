name: SDK Release

# Semantic release for @accord-protocol/sdk. On every push to main that touches
# the SDK, Conventional Commits since the last `sdk-v*` tag decide whether to
# release and which version. A release publishes to npm with provenance, pushes
# the `sdk-v<version>` tag and creates a GitHub Release with generated notes.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so this never
# double-publishes through sdk-publish.yml (kept as the manual tag fallback).

on:
  push:
    branches: [main]
    paths:
      - 'packages/sdk/**'
      - '.github/workflows/sdk-release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the release plan'
        type: boolean
        default: true

permissions:
  contents: write # push the release tag and create the GitHub Release
  id-token: write # npm provenance attestation

# Releases are serialized and never cancelled mid-publish.
concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, publish & tag SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - name: Checkout repository (full history for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build package (ESM, CJS & TypeScript declarations)
        run: npm run build

      - name: Enforce bundle-size budgets
        run: npm run size

      - name: Verify package bundle contents
        run: npm run pack:dry

      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Plan release (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node scripts/release.mjs

      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --publish
