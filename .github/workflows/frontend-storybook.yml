name: Frontend Storybook & Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-storybook.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-storybook.yml"

# Cancel superseded pull-request runs on the same branch; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storybook-visual:
    name: Storybook build & visual snapshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual snapshot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-snapshots
          path: frontend/src/visual/__snapshots__/
          retention-days: 14

      - name: Report visual regression failure
        if: failure()
        run: |
          echo "::error::Visual regression test failure detected across transaction preview, risk, or error state snapshots. See artifacts at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
          {
            echo "### Visual Regression Failure"
            echo "One or more component visual regression snapshots drifted from the baseline without exposing secrets."
            echo "Inspect snapshot diffs and artifacts at [Action Run Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Storybook static site
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: frontend/storybook-static
          retention-days: 14
