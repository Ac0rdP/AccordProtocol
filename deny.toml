# Config for cargo-deny
#
# Advisories: newer cargo-deny versions removed vulnerability/notice lint
# levels. unmaintained/unsound now select which crates can fail the check
# (all | workspace | transitive | none), not warn/deny/allow.

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Match previous "warn" intent: do not fail CI on unmaintained/unsound crates.
unmaintained = "none"
unsound = "none"
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "allow"

# Transitive dependencies pinned by upstream crates; we cannot control their versions.
[[bans.skip]]
name = "darling"

[[bans.skip]]
name = "spin"

[licenses]
# Only licenses that actually appear in the current dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "LGPL-2.1-or-later",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
