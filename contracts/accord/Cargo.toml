[package]
name = "accord"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Coverage gate (read by .github/workflows/contract.yml; see CONTRIBUTING.md,
# "Coverage threshold"). CI fails when line coverage of the contract source
# (test and benchmark code excluded) drops below this percentage.
[package.metadata.coverage]
min-line-coverage = 85

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# CI-only fixture used by the testnet upgrade simulation (#816). It builds a
# contract whose `initialize` omits the governance-migration flag and the
# storage-schema stamp, so the deployed instance looks like a pre-migration
# deployment. Never enable this for a production build.
legacy-fixture = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
